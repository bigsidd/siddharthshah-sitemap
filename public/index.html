<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siddharth Shah</title>
<meta name="description" content="Siddharth Shah builds products and runs partnerships. Ten years in mobile and location advertising. Also runs Upward Ventures.">
<link rel="canonical" href="https://siddharthshah.me/">
<meta property="og:title" content="Siddharth Shah">
<meta property="og:description" content="Products and partnerships. Ten years in mobile and location advertising. Also runs Upward Ventures.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://siddharthshah.me/">
<meta property="og:image" content="https://siddharthshah.me/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F3EEE4">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
:root{--paper:#F3EEE4;--ink:#1E3A2F;--muted:#4A4636;--rule:#1E3A2F;--accent:#A8431F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
h1{text-wrap:balance} p{text-wrap:pretty}
a{color:inherit}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.page{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 24px}
.card{width:100%;max-width:880px;border-top:3px double var(--rule);border-bottom:3px double var(--rule);display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:center;padding:40px 0}
.photo{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border:1px solid var(--rule);outline:1px solid var(--rule);outline-offset:4px}
.label{margin:0 0 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 18px;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1;letter-spacing:-0.03em}
.copy p{margin:0 0 12px;font-size:19px;line-height:1.6;max-width:52ch}
.copy p a{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.links{list-style:none;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:4px 28px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:16px;font-weight:500}
.links a{display:inline-block;padding:12px 0;text-decoration:none;background:linear-gradient(var(--accent),var(--accent)) no-repeat 0 calc(100% - 8px)/0% 2px;transition:background-size .25s ease-out}
.links a span{display:inline-block;transition:transform .2s ease-out}
@media (hover:hover){.links a:hover{background-size:100% 2px}.links a:hover span{transform:translate(2px,-2px)}}
.links a:focus-visible{background-size:100% 2px}
.links span{color:var(--accent)}
@media (max-width:700px){.card{grid-template-columns:1fr;gap:28px;padding:32px 0}.photo{max-width:160px}}

/* Upward Ventures: the one UVX glyph, shown on hover */
.uvx .uv{display:inline-block;width:0;overflow:hidden;vertical-align:-2px;color:var(--ink);transition:width .2s ease-out,margin .2s ease-out}
.uvx .uv svg{width:16px;height:16px;display:block}
@media (hover:hover){.uvx:hover .uv{width:16px;margin-left:5px}}
.uvx:focus-visible .uv{width:16px;margin-left:5px}
/* postmark: Los Angeles + live local time; tap for the viewer's own time */
.label{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.postmark{font:inherit;font-size:13px;letter-spacing:inherit;text-transform:inherit;white-space:nowrap;color:var(--ink);background:transparent;border:3px double var(--ink);border-radius:999px;padding:0 14px;min-height:44px;transform:rotate(-2.5deg);cursor:pointer}
.label .night{font-size:13px;color:var(--accent)}
.postmark:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  .card{animation:open .7s cubic-bezier(.6,0,.2,1) backwards}
  @keyframes open{from{clip-path:inset(-12px 50% -12px 50%)}to{clip-path:inset(-12px 0 -12px 0)}}
  .photo{animation:frame .6s .55s ease-out backwards}
  @keyframes frame{from{outline-offset:14px;outline-color:transparent;opacity:0}to{outline-offset:4px;opacity:1}}
  .copy>*{animation:settle .5s ease-out backwards}
  .copy>:nth-child(2){animation-delay:.65s}.copy>:nth-child(3){animation-delay:.75s}.copy>:nth-child(4){animation-delay:.85s}.copy>:nth-child(5){animation-delay:.95s}
  @keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .copy>.label{animation:press .2s 1.2s cubic-bezier(.2,.9,.2,1) backwards}
  @keyframes press{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
}
</style>
</head>
<body>
<main class="page">
<div class="card">
<picture><source srcset="/brand/siddharth.webp" type="image/webp"><img class="photo" src="/brand/siddharth.jpg" width="512" height="512" alt="Siddharth Shah"></picture>
<div class="copy">
<p class="label">Los Angeles</p>
<h1>Siddharth&nbsp;Shah</h1>
<p>I build products and run partnerships. Ten years in mobile and location advertising, at Kiip, NinthDecimal and&nbsp;InMarket.</p>
<p>I also run <a class="uvx" href="https://upwardvx.com">Upward Ventures<span class="uv" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.4 10.6 10.4 5.6M6.9 5.6h3.5v3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg></span></a>, which takes recurring work off business owners’&nbsp;desks.</p>
<ul class="links">
<li><a href="https://linkedin.com/in/siddharthshah">LinkedIn <span aria-hidden="true">↗</span></a></li>
<li><a href="https://github.com/bigsidd">GitHub <span aria-hidden="true">↗</span></a></li>
<li><a href="https://x.com/bigsidd">X <span aria-hidden="true">↗</span></a></li>
</ul>
</div>
</div>
</main>
<script>
(()=>{const l=document.querySelector('.label');const b=document.createElement('button');b.type='button';b.className='postmark';b.setAttribute('aria-pressed','false');b.title='Show your local time';l.textContent='';const night=document.createElement('span');night.className='night';night.textContent='Replies in the morning';night.hidden=true;l.append(b,night);
const la=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',weekday:'short',hour:'numeric',minute:'2-digit'});
const hr=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',hourCycle:'h23'});
const me=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'});
const draw=()=>{const now=new Date();if(b.getAttribute('aria-pressed')==='true'){b.textContent='Your time · '+me.format(now).replace(',','');night.hidden=true;return}
const h=+hr.format(now);b.textContent='Los Angeles · '+la.format(now).replace(',','');night.hidden=!(h>=22||h<7)};
b.addEventListener('click',()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');b.title=b.getAttribute('aria-pressed')==='true'?'Show Los Angeles time':'Show your local time';draw()});
draw();setInterval(draw,30000);})();
</script>
</body>
</html>
